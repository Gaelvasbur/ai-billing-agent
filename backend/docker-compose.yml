services:
  postgres:
    image: postgres:15
    container_name: ai-billing-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_billing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
